
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tor Lawyer</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Our CSS -->
    <link rel="stylesheet"
          href="/static/css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                Tor Lawyer
            </a>

            <div class="ms-auto">
                <a href="/" class="btn btn-link text-dark">
                    Home
                </a>

                <a href="/review"
                   class="btn btn-primary">
                    Review Agreement
                </a>
            </div>

        </div>
    </nav>

    <!-- Page content -->
    <main class="container py-5">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-top py-4 bg-white">
        <div class="container text-center">
            <small class="text-muted">
                Tor Lawyer provides general information,
                not legal advice from a licensed lawyer.
            </small>
        </div>
    </footer>

</body>
</html>
